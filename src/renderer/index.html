<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laporan Keuangan</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-shell">
    <aside id="sidebar">
      <div class="brand">
        <img src="../../assets/icon.png" alt="" class="brand__mark" />
        <div class="brand__text">
          <strong>Laporan Keuangan</strong>
          <span id="brand-company">Nama Usaha Anda</span>
        </div>
      </div>
      <nav id="nav-list" class="nav-list"></nav>
      <div class="sidebar__footer">
        <span id="app-version-label">v-</span>
      </div>
    </aside>

    <div id="main-col">
      <header id="topbar">
        <button id="btn-menu-toggle" class="btn btn--ghost btn--icon" title="Sembunyikan/Tampilkan menu" aria-label="Menu">☰</button>
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar__spacer"></div>
        <div id="topbar-tools"></div>
      </header>
      <main id="view-root" class="view-root">
        <div class="loading-splash">Memuat aplikasi…</div>
      </main>
    </div>
  </div>

  <div id="modal-layer" class="modal-layer" aria-hidden="true"></div>

  <!-- Semua skrip lokal (offline penuh, tidak ada CDN / skrip jarak jauh) -->
  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/vtable.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/shared-ui.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/accounts.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/ledger.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/dataio.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
